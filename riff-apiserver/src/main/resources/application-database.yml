spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${local.configurator.database.mysql.address}/${local.configurator.database.mysql.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&autoReconnect=true&allowMultiQueries=true&allowPublicKeyRetrieval=true
    username: ${local.configurator.database.mysql.username}
    password: ${local.configurator.database.mysql.password}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
